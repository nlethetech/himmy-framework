[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "himmy"
# Single-sourced from himmy.__version__ (the one human-edited literal). setuptools
# AST-extracts the string with NO module import, so this stays safe to build offline.
dynamic = ["version"]
description = "Himmy Agent Framework — an offline-first, entity-backed Python agent framework."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Himmy" }]
keywords = ["agents", "llm", "inference", "entities", "framework"]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.scripts]
himmy = "himmy.cli.__main__:main"

[project.optional-dependencies]
# Floor only: Starlette >=0.49.1 fixes the FileResponse Range-header DoS /
# Host-header URL issues that Studio's StaticFiles + FileResponse would otherwise be
# exposed to. No upper ceiling — `himmy.api.route_introspection.collect_route_paths`
# walks routes recursively and handles BOTH the flattened model (FastAPI 0.116–0.136)
# and the `_IncludedRouter`/Starlette-1.x nested-route model (FastAPI 0.137+), so our
# /readyz + parity route introspection works across the whole range.
api = [
    "fastapi>=0.116",
    "uvicorn>=0.29",
    "starlette>=0.49.1",
    # multipart form parsing (Studio KB file upload); without it the upload
    # endpoint degrades to a clear 400 rather than failing at import time.
    "python-multipart>=0.0.9",
]
# Himmy Studio — the local web GUI (chat, agent builder, run/trace browser). Served
# by the same FastAPI BFF; the built frontend ships as package data under
# himmy/api/_studio_static. Same runtime deps as `api`.
studio = [
    "fastapi>=0.116",
    "uvicorn>=0.29",
    "starlette>=0.49.1",
    "python-multipart>=0.0.9",
]
# Enterprise auth: OIDC/JWT bearer verification for the BFF (RSA/EC via cryptography).
auth = ["pyjwt[crypto]>=2.8"]
# ML-based DLP/PII detection (beyond the built-in regex rules).
dlp = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
# Field-level encryption at rest (envelope AES-GCM).
encryption = ["cryptography>=42"]
# Managed secret backends (Vault uses plain HTTP, so no extra). Pick per platform.
secrets-aws = ["boto3>=1.34"]
secrets-gcp = ["google-cloud-secret-manager>=2.16"]
secrets-azure = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.7"]
# Cloud KMS for field-level encryption (envelope KEK provider). AWS is the
# reference impl; GCP/Azure are documented seams that reuse the secrets-* deps.
kms-aws = ["boto3>=1.34"]
providers = ["pydantic-ai>=0.0.1"]
# Direct provider SDKs (no pydantic-ai indirection). Optional; the runtime
# auto-detects them when the matching API key is present.
anthropic = ["anthropic>=0.49"]
openai = ["openai>=1.0"]
postgres = ["asyncpg>=0.29"]
knowledge = ["pgvector>=0.2", "openai>=1.0", "pypdf>=4.0"]
observability = ["logfire>=0.30"]
# Nepal data connectors: Nepali-news RSS aggregation + NRB forex/macro (Excel).
connectors = ["feedparser>=6", "openpyxl>=3"]
# Discord GATEWAY listener only (receiving arbitrary channel messages over a WebSocket
# with the Message Content intent). The slash-command interactions webhook + the
# post-message tool need NO extra: Ed25519 verification uses `cryptography` (already in
# the `auth`/`encryption` extras) and HTTP uses the core `httpx`.
discord = ["discord.py>=2.3"]
# Nepal domain primitives: the Bikram Sambat calendar.
nepal = ["nepali-datetime>=1.0"]
# Optional full-fidelity JSON Schema validation for tool args/output. Without it,
# Himmy falls back to a built-in offline schema-validation subset.
validation = ["jsonschema>=4"]
# Quality boosters for the built-in toolkit (web_fetch readability). The default
# paths work without it (stdlib HTML parsing); this just improves extraction.
toolkit = ["beautifulsoup4>=4.12"]
# A self-contained local embedding model (ONNX) for real semantic recall in the
# knowledge/memory packs. Ollama/OpenAI embedders need no new deps.
embeddings = ["fastembed>=0.3"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    # property-based tests (tests importorskip it, so it stays dev-only)
    "hypothesis>=6",
    "jsonschema>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6",
    # so the OIDC auth tests run in CI (the runtime dep lives in the `auth` extra)
    "pyjwt[crypto]>=2.8",
    # PyPA build frontend: lets test_built_wheel_contains_studio_gui actually run
    # the wheel-bundles-the-GUI gate (it importorskips `build`, so without this a
    # fresh dev venv silently skips that contract).
    "build>=1",
]
all = [
    "fastapi>=0.116",
    "uvicorn>=0.29",
    "starlette>=0.49.1",
    "python-multipart>=0.0.9",
    "pydantic-ai>=0.0.1",
    "anthropic>=0.49",
    "asyncpg>=0.29",
    "pgvector>=0.2",
    "openai>=1.0",
    "pypdf>=4.0",
    "logfire>=0.30",
    "boto3>=1.34",
    "feedparser>=6",
    "openpyxl>=3",
    "nepali-datetime>=1.0",
    "jsonschema>=4",
    "beautifulsoup4>=4.12",
    "fastembed>=0.3",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.dynamic]
# The lone version literal lives in himmy/__init__.py; setuptools reads it via AST
# (no import), so building never executes the package.
version = { attr = "himmy.__version__" }

[tool.setuptools.packages.find]
include = ["himmy*"]

[tool.setuptools.package-data]
himmy = [
    "services/prompts/configs/prompts/*.yaml",
    "benchmark/suites/*.yaml",
    "services/inference/prices.json",
    "demovideo/player.html",
    # Himmy Studio: the built (Vite) frontend, emitted here by `npm run build`.
    # Globs match nothing in a source checkout that hasn't built the GUI yet.
    "api/_studio_static/*",
    "api/_studio_static/assets/*",
    "api/_studio_static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: end-to-end tests against a real provider (Ollama); skip when absent",
    "slow: heavy load/concurrency/profiling tests; excluded from the default run",
]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
    "ignore:.*urllib3.*:Warning",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["himmy.egg-info"]

[tool.ruff.lint]
# Pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP), flake8-bugbear (B),
# flake8-bandit (S = SAST / security, WS5.3). The dangerous S rules (exec, pickle,
# weak hashes, shell=True, os.system, verify=False) stay ACTIVE; only known-safe,
# high-false-positive classes are ignored below with justification.
select = ["E", "W", "F", "I", "UP", "B", "S"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults (common FastAPI Depends pattern)
    "UP042",  # `str, Enum` is intentional: stable JSON/Postgres serialization vs StrEnum
    "UP007",  # `Optional[X]`/`Union` retained where it reads clearer than `X | Y`
    "UP047",  # PEP 695 generic syntax not required for this 3.12 baseline
    "S101",   # assert: used for type-narrowing in source + the basis of every test
    "S110",   # try/except/pass: intentional best-effort teardown/close (commented)
    "S112",   # try/except/continue: intentional skip of malformed input
    "S311",   # random: only used for non-cryptographic variance, never secrets
    "S108",   # hardcoded /tmp: tempfile is used safely; literals are container mounts
]

[tool.ruff.lint.per-file-ignores]
# The example bootstrap intentionally manipulates sys.path before importing.
"examples/_runtime.py" = ["E402"]
# Tests: fixtures use fake passwords/tokens and drive real subprocesses (docker/python).
"tests/**" = ["B011", "S105", "S106", "S603", "S607"]
# Persistence layers: queries are parameterized (?/$n) with constant column-list
# identifiers — no user-input concatenation; the read-only sql_query tool is
# separately sandboxed. (The dangerous S rules stay active everywhere.)
"himmy/services/storage/postgres.py" = ["S608"]
"himmy/entities/postgres.py" = ["S608"]
"himmy/entities/sqlite_registry.py" = ["S608"]
"himmy/services/knowledge/backend.py" = ["S608"]
"himmy/services/observability/trace.py" = ["S608"]
# The empty-result hint introspects DISTINCT values; the table/column identifiers come
# from PRAGMA/sqlite_master and are regex-restricted to \w + validated against the live
# schema — never raw model input. Values still go through the parameterized query path.
"himmy/toolkit/data.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
files = ["himmy"]
ignore_missing_imports = false
# Near-strict: every flag in mypy's ``--strict`` is enabled here EXCEPT
# ``warn_unused_ignores``. That one is intentionally off: many ``# type: ignore``
# comments guard imports/calls into OPTIONAL extras (pydantic-ai, asyncpg, openai,
# presidio, …). With the extras installed (CI/dev) those ignores look "unused", but
# they are required when the extras are absent (the offline-first base install), so
# flagging them would force their removal and break no-extras type-checking.
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
warn_return_any = true
warn_unused_configs = true
strict_equality = true
extra_checks = true
no_implicit_reexport = true

# Optional third-party deps (only present with the relevant extras installed) have
# no stubs in the base/offline environment — don't fail the gate on them.
[[tool.mypy.overrides]]
module = [
    "pydantic_ai.*",
    "logfire.*",
    "asyncpg.*",
    "openai.*",
    "pypdf.*",
    "feedparser.*",
    "openpyxl.*",
    "nepali_datetime.*",
    "transformers.*",
    "boto3.*",
    "google.*",
    "azure.*",
    "presidio_analyzer.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["himmy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
