name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (offline-capable extras + dev tooling)
        # Mirrors the local set that the suite is green against. The providers
        # (pydantic-ai) and observability (logfire) extras are intentionally
        # omitted — their tests skip cleanly when absent.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,postgres,knowledge,connectors,nepal,dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy himmy

      - name: Pytest (with coverage)
        # Postgres/provider/observability tests skip without a DB/keys/extras.
        run: pytest -q --cov=himmy --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
