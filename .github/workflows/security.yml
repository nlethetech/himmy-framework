name: Security

# Supply-chain & secure-SDLC gates (WS5): dependency audit, SBOM, secret scan, and a
# filesystem vulnerability/misconfig scan. Runs alongside the main quality gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, so new CVEs surface even without a push

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: pip-audit (known CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit installed dependencies for known vulnerabilities
        run: |
          pip install -e ".[api,postgres,knowledge,connectors,nepal,auth]"
          pip-audit --desc

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip cyclonedx-bom
          pip install -e ".[api,postgres,knowledge,connectors,nepal,auth]"
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so a secret in any commit is caught
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln-scan:
    name: trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (deps + misconfig)
        # Pinned by SHA (WS5.5) == v0.36.0. Report-only: pip-audit is the blocking
        # CVE gate; Trivy adds misconfig/secret/IaC findings without flaking the
        # build on unfixable transitive vulnerabilities.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
