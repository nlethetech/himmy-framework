name: Build Wheel

# Closes the "wheel can silently ship without the GUI" gap: a wheel built from a
# checkout that never ran the Studio frontend build is importable and installs
# fine, but `himmy studio` then reports the GUI isn't built. The actual build +
# GUI-in-wheel assert + clean-venv smoke live in the REUSABLE
# build-and-verify-wheel.yml so release.yml and this CI job share one definition
# (no copy-pasted ~60-line block to drift).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - studio/**
      - himmy/api/**
      - pyproject.toml
      - .github/workflows/build-wheel.yml
      - .github/workflows/build-and-verify-wheel.yml
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-wheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel:
    name: build + verify wheel
    uses: ./.github/workflows/build-and-verify-wheel.yml
    # No expected-tag on CI — the tag guard only applies to release.yml.
