name: Integration (real provider)

# WS5.6 — runs the agent against a REAL local model (Ollama) so the offline stub can
# never again hide a broken core path (e.g. a tool agent returning an empty answer).
# Mark this job "required" in branch protection so the regression can't merge.
on:
  # NOT on every push to main — this real-Ollama suite is heavy and was creating
  # notification noise on a push-often workflow. It still runs on PRs (so a regression
  # can't merge), nightly (pass-rate tracking), and on demand (the "Run workflow" button).
  pull_request:
  workflow_dispatch:
    inputs:
      trials:
        description: "benchmark trials per task (nightly benchmark job)"
        required: false
        default: "10"
  schedule:
    - cron: "0 7 * * *" # nightly: track agent pass-rate over time

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ollama-integration:
    name: agent vs. Ollama (qwen2.5:7b)
    # Nightly + manual — NOT a PR gate. These are live-model BEHAVIOR tests (does a
    # 3B quantized model decide to call the handoff tool, do 3 concurrent CPU
    # generations finish in budget) and on the shared 4-vCPU runner the failure set
    # rotates run-to-run with byte-identical request payloads — they test the
    # model+hardware, not the framework. The framework mechanics are covered by the
    # offline suite on every PR, and the PR keeps a live-model gate: the
    # benchmark-gate job below, which is stable on this runner. Failures here alert
    # on the nightly run instead of blocking merges.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 7b on a CPU runner is slow but RELIABLE; 45 min covers pull + 12 tests.
    timeout-minutes: 45
    env:
      # 3b proved below the capability floor for the agentic-BEHAVIOR tests on
      # the shared CPU runner (handoff tool-calls never fired, fan-out answers
      # empty across retries/env-tuning/version pins — nightly red since
      # 2026-06-10) while 7b is consistently reliable. The tests assert
      # behavior, so the model must be capable of the behavior; the benchmark
      # job keeps 3b for its relative metrics.
      HIMMY_INTEGRATION_MODEL: qwen2.5:7b-instruct
      # CPU-only runner: generation is ~10x slower than a dev laptop, and the
      # fan-out test runs 3 workers CONCURRENTLY — without parallel slots Ollama
      # serializes them and the queue tail blows the default 120s request budget
      # (observed as every worker returning an empty answer). 3 slots + a 300s
      # budget sized to the runner, not the laptop the tests were written on.
      OLLAMA_NUM_PARALLEL: "3"
      HIMMY_OLLAMA_TIMEOUT: "300"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install himmy (provider path needs only httpx + dev tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install + start Ollama
        run: |
          # Pinned: unpinned "latest" changed qwen2.5 tool-calling behavior between
          # runs (handoff/fan-out live tests went green->red with identical request
          # payloads). Bump deliberately, watching the live multi-agent tests.
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.13.5 sh
          ollama -v
          ollama serve &
          # Wait for the daemon to accept connections.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break || sleep 2
          done

      - name: Pull the integration model
        run: ollama pull "$HIMMY_INTEGRATION_MODEL"

      - name: Warm the model (load weights before the first timed request)
        # CPU model load is tens of seconds; without this the FIRST test request
        # pays it out of its own inference budget.
        run: |
          curl -sf http://localhost:11434/api/generate \
            -d "{\"model\": \"$HIMMY_INTEGRATION_MODEL\", \"prompt\": \"ok\", \"stream\": false}" \
            >/dev/null

      - name: Run the real-provider integration tests
        # Scope collection to tests/integration so pytest doesn't import the api/db
        # test modules (which need extras this lean provider lane doesn't install).
        run: pytest -q -m integration tests/integration

  benchmark:
    name: agent benchmark vs. Ollama (qwen2.5:3b)
    # Nightly + manual — NOT on PRs (the full suite at >= 10 trials is too slow to gate
    # every PR; the PR-sized gate below covers that). This is the standing eval that
    # answers "did this change make agents better or worse?" with tight CIs: 10 trials
    # per task gives a pooled n of 150 (vs the old 2 trials / n=30, whose ±15% CI could
    # not see a 5% regression).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BENCH_TRIALS: ${{ github.event.inputs.trials || '10' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install himmy with the packs the suite exercises
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,nepal,knowledge]"

      - name: Install + start Ollama
        run: |
          # Pinned: unpinned "latest" changed qwen2.5 tool-calling behavior between
          # runs (handoff/fan-out live tests went green->red with identical request
          # payloads). Bump deliberately, watching the live multi-agent tests.
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.13.5 sh
          ollama -v
          ollama serve &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break || sleep 2
          done

      - name: Pull the benchmark model
        run: ollama pull qwen2.5:3b-instruct

      - name: Run the standing benchmark (regression gate)
        # --fail-under is a floor, not a target: a real regression (e.g. a broken tool
        # loop) tanks accuracy well below it. The per-category table is the diagnostic.
        run: |
          python -m himmy bench \
            --models ollama:qwen2.5:3b-instruct \
            --trials "$BENCH_TRIALS" \
            --fail-under 0.6 \
            --json bench-results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench-results.json

  benchmark-gate:
    name: benchmark PR gate (baseline floors)
    # PR-sized companion to the nightly benchmark: a 6-task subset of the core suite at
    # 5 trials (the `gate` block of benchmarks/baseline.json) compared against
    # checked-in metric floors + the SHA that produced them. Fails the PR when accuracy
    # / tool-call accuracy / error rate regress past the floors. Re-baselining after an
    # intentional quality shift is `make bench-rebaseline` (commit the JSON diff).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install himmy with the packs the gate subset exercises
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,knowledge]"

      - name: Install + start Ollama
        run: |
          # Pinned: unpinned "latest" changed qwen2.5 tool-calling behavior between
          # runs (handoff/fan-out live tests went green->red with identical request
          # payloads). Bump deliberately, watching the live multi-agent tests.
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.13.5 sh
          ollama -v
          ollama serve &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break || sleep 2
          done

      - name: Pull the benchmark model
        run: ollama pull qwen2.5:3b-instruct

      - name: Warm the model (load weights before the first timed request)
        run: |
          curl -sf http://localhost:11434/api/generate \
            -d '{"model": "qwen2.5:3b-instruct", "prompt": "ok", "stream": false}' \
            >/dev/null

      - name: Run the gate benchmark against the checked-in baseline
        env:
          HIMMY_OLLAMA_TIMEOUT: "300"
        run: python scripts/bench_gate.py run --json bench-pr-results.json

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-pr-gate-results
          path: bench-pr-results.json
