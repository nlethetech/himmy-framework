name: Deploy

# Validates the deployment surface — the image builds and serves /health, the
# Helm chart lints + renders, the full-stack compose is well-formed, and the
# air-gap bundle plan is sound. Kept OUT of ci.yml so the per-PR quality gate
# stays fast: these jobs only run when the deployment artifacts change (plus
# push-to-main). It NEVER pulls real models or assembles the real air-gap bundle.
on:
  push:
    branches: [main]
    # Tags drive the ghcr publish job below (see `publish`). A `v*` tag or a GitHub
    # Release both build + push the multi-arch runtime image to ghcr.io/nlethetech/himmy.
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - deploy/**
      - scripts/airgap_bundle.py
      - scripts/airgap_install.sh
      - scripts/ops_*.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy.yml
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: image build + /health poll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Studio image (GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: himmy-studio:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container and poll /health
        run: |
          docker run -d --name himmy-studio-ci -p 8765:8765 himmy-studio:ci
          # /health is UNGUARDED and needs no Postgres, so a bare container answers
          # it. Poll for up to ~90s before giving up.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8765/health; then
              echo "health ok after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::/health never came up"
          exit 1

      - name: Container logs (on failure)
        if: failure()
        run: docker logs himmy-studio-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f himmy-studio-ci || true

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint the chart
        run: helm lint deploy/helm/himmy-studio

      - name: Render with ingress enabled
        run: >-
          helm template deploy/helm/himmy-studio
          --set ingress.enabled=true
          --set ingress.hosts[0].host=himmy.ci.example.com
          >/dev/null

      - name: Render with an external Postgres secret
        run: >-
          helm template deploy/helm/himmy-studio
          --set database.existingSecret=himmy-db
          >/dev/null

  compose:
    name: compose config (± ollama)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate the full-stack compose file
        # config -q parses + interpolates the file and exits non-zero on any error.
        # POSTGRES_PASSWORD is interpolated into the DSN, so give config a value.
        env:
          POSTGRES_PASSWORD: ci-placeholder
        run: |
          docker compose -f deploy/compose/docker-compose.yml config -q
          docker compose -f deploy/compose/docker-compose.yml --profile ollama config -q

  airgap-dry-run:
    name: air-gap bundle (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify the dependency lock is in sync with pyproject
        # The lock is the reproducible-install anchor for both the air-gap
        # wheelhouse and CI installs. Fail if pyproject drifted without `uv lock`.
        run: uv lock --check

      - name: Plan the air-gap bundle (no downloads, no docker save)
        run: python scripts/airgap_bundle.py build --dry-run

  publish:
    name: build + push multi-arch image to ghcr
    # Only on a version tag or a published Release — never on PRs or plain main pushes
    # (those keep to the local `load:`-only smoke test in the `image` job above). This is
    # what makes `FROM ghcr.io/nlethetech/himmy:<version>` (the base image `himmy init` /
    # `himmy deploy --docker` emit) resolvable for pip-install users with no checkout.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GitHub Container Registry (ghcr.io)
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU (arm64 emulation for the multi-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN scoped by `packages: write` above — no PAT needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nlethetech/himmy
          # A release tagged `v0.2.0` publishes `0.2.0`, `0.2`, and `latest` so both
          # the exact pin the CLI writes (`:0.2.0`) and `:latest` resolve.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build + push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
