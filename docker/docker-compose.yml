# Local Postgres + pgvector for the Himmy [postgres] / [knowledge] extras.
# Bring it up with:  docker compose -f docker/docker-compose.yml up -d
# Then point HIMMY_TEST_POSTGRES_DSN at it:
#   postgresql://himmy:himmy@localhost:5433/himmy
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: himmy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: himmy
      POSTGRES_USER: himmy
      POSTGRES_PASSWORD: himmy
    ports:
      - "5433:5432"
    volumes:
      - himmy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himmy -d himmy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  himmy_pgdata:
