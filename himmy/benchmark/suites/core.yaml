name: core
# The standing model benchmark: a fixed set of graded tasks across capability
# categories, run with `himmy bench`. Every task is OFFLINE and self-contained (files /
# sqlite fixtures materialized per trial), so the suite is reproducible anywhere — and
# runs unchanged in CI against a real local model. Several tasks are regression cases for
# documented small-model failure modes (noted inline).
tasks:
  # --- single tool use -----------------------------------------------------------------
  - id: arithmetic
    category: arithmetic
    prompt: "What is 17 times 23? Use the calculator tool."
    packs: [utils]
    expect_tools: [calculator]
    grade: { type: numeric, value: 391 }

  - id: file_read
    category: files
    prompt: "Read notes.txt and tell me exactly how many ducks the farm has."
    packs: [files]
    expect_tools: [read_file]
    files:
      notes.txt: "The farm has 12 ducks, 30 chickens, and 4 beehives.\n"
    grade: { type: numeric, value: 12 }

  - id: sql_count
    category: sql
    prompt: "What is the quantity value recorded for chickens in the animals table?"
    packs: [data]
    expect_tools: [sql_query]
    instructions: ["The DB has a table animals(name TEXT, quantity INTEGER)."]
    sqlite:
      - "CREATE TABLE animals(name TEXT, quantity INTEGER); INSERT INTO animals VALUES ('ducks',12),('chickens',30),('bees',40000);"
    grade: { type: numeric, value: 30 }

  - id: reasoning_noTool
    category: reasoning
    prompt: "What is the capital of France? Answer in one word."
    grade: { type: contains, value: paris }

  - id: nepal_date
    category: nepal
    prompt: "Convert the date 2026-06-05 to Bikram Sambat."
    packs: [nepal]
    expect_tools: [nepali_date]
    grade: { type: contains, value: "2083" }

  - id: nepal_format
    category: nepal
    prompt: "Format the amount 1234567 as Nepali rupees."
    packs: [nepal]
    expect_tools: [nepali_format]
    grade: { type: numeric, value: 1234567 }

  # --- multi-step (2+ tools in one run) ------------------------------------------------
  - id: multistep_file_math
    category: multistep
    prompt: "Read fruit.txt, then use the calculator to tell me the total number of fruits."
    packs: [files, utils]
    expect_tools: [read_file]
    files:
      fruit.txt: "Apples: 18\nOranges: 27\n"
    grade: { type: numeric, value: 45 }

  - id: sql_schema_discovery
    category: multistep
    prompt: "A table about animals exists but you don't know its columns. Discover them, then report the value stored for the row whose name is exactly 'bees'."
    packs: [data]
    expect_tools: [sql_schema]
    sqlite:
      - "CREATE TABLE animals(name TEXT, quantity INTEGER); INSERT INTO animals VALUES ('ducks',12),('chickens',30),('bees',40000);"
    grade: { type: numeric, value: 40000 }

  - id: sql_aggregate
    category: sql
    prompt: "What is the total quantity across ALL rows of the animals table?"
    packs: [data]
    expect_tools: [sql_query]
    instructions: ["The DB has a table animals(name TEXT, quantity INTEGER)."]
    sqlite:
      - "CREATE TABLE animals(name TEXT, quantity INTEGER); INSERT INTO animals VALUES ('ducks',12),('chickens',30),('bees',40000);"
    grade: { type: numeric, value: 40042 }

  # --- RAG (ingest + retrieve, offline embedder) ---------------------------------------
  - id: rag_grounded
    category: rag
    prompt: >
      First store this note with kb_ingest, then use kb_search to answer: what is the
      prize goat's name? Note: "The farm's prize goat is named Himmy."
    packs: [knowledge]
    expect_tools: [kb_search]
    grade: { type: contains, value: himmy }

  # --- memory recall -------------------------------------------------------------------
  - id: memory_recall
    category: memory
    prompt: "Use the remember tool to store that my favorite crop is millet, then recall my favorite crop."
    packs: [memory]
    expect_tools: [remember]
    grade: { type: contains, value: millet }

  # --- agentic working state -----------------------------------------------------------
  - id: agentic_scratchpad
    category: agentic
    prompt: "Use scratchpad_set to store the value 'tractor' under the key 'tool', then read it back with scratchpad_get and report it."
    packs: [agentic]
    expect_tools: [scratchpad_set]
    grade: { type: contains, value: tractor }

  # --- regression cases (documented small-model failure modes) -------------------------
  - id: rx_sql_literal_recovery
    category: regression
    # qwen guesses the singular 'chicken' vs the stored 'chickens'; the 0-row hint must
    # surface the real values so it self-corrects. (data pack self-correcting SQL)
    prompt: "What is the quantity value recorded for chicken in the animals table? It may be stored under a slightly different name."
    packs: [data]
    expect_tools: [sql_query]
    instructions: ["The DB has a table animals(name TEXT, quantity INTEGER)."]
    sqlite:
      - "CREATE TABLE animals(name TEXT, quantity INTEGER); INSERT INTO animals VALUES ('ducks',12),('chickens',30),('bees',40000);"
    grade: { type: numeric, value: 30 }

  - id: rx_todo_flat_array
    category: regression
    # todo_write used a nested array-of-objects schema that small models silently choke
    # on; it is now a flat array of strings. This guards that regression.
    prompt: "Use todo_write to record a 3-step plan to plant a tree."
    packs: [agentic]
    expect_tools: [todo_write]
    grade:
      type: any_of
      of:
        - { type: contains, value: step }
        - { type: regex, value: "\\b1\\b" }

  - id: rx_synthesis_after_tool
    category: regression
    # Small models often call a tool then fall silent (empty final answer); the synthesis
    # nudge must convert the gathered result into a real answer.
    prompt: "Read secret.txt and tell me the code word it contains."
    packs: [files]
    expect_tools: [read_file]
    files:
      secret.txt: "The code word is MARIGOLD.\n"
    grade: { type: contains, value: marigold }
