{{- if .Values.ingress.enabled -}}
{{- $fullName := printf "%s-api" (include "himmy-agent.fullname" .) -}}
{{- $svcPort := .Values.api.service.port -}}
{{- if eq .Values.api.bindHost "127.0.0.1" -}}
{{- fail "himmy-agent: ingress.enabled but api.bindHost is 127.0.0.1 — the endpoint is loopback-only and the ingress cannot reach it. Set api.bindHost=0.0.0.0 AND auth.mode (himmy fails closed on an unauthenticated off-loopback bind) before exposing." -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "himmy-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
