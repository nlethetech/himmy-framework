apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "himmy-agent.fullname" . }}-api
  labels:
    {{- include "himmy-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Single replica only — the /app/.himmy SQLite stores are single-writer on an
  # RWO PVC (see values.yaml header).
  replicas: {{ .Values.api.replicaCount }}
  # Recreate (not RollingUpdate): the RWO PVC can only attach to one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "himmy-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "himmy-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # `himmy serve -f agent.yaml` exposes the agent as a signature-verified
          # webhook. Fail-closed default bindHost 127.0.0.1: reachable only in-pod
          # until auth.mode is set and bindHost widened to 0.0.0.0 (create_app
          # refuses an unauthenticated off-loopback bind).
          # The image has NO ENTRYPOINT (only CMD), and `args:` REPLACES CMD without
          # prepending anything — so we pin `command: ["himmy"]` explicitly, else the
          # kubelet execs "serve" and the pod CrashLoops.
          command:
            - "himmy"
          args:
            - "serve"
            - "-f"
            - "/app/agent.yaml"
            - "--host"
            - {{ .Values.api.bindHost | quote }}
            - "--port"
            - {{ .Values.api.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            {{- include "himmy-agent.commonEnv" . | nindent 12 }}
          # exec probes (NOT httpGet): with the fail-closed default bindHost 127.0.0.1
          # uvicorn listens only on the container loopback, so a kubelet httpGet to the
          # POD IP would be refused and CrashLoop the pod. curl-in-container runs in the
          # pod's own netns, so it reaches loopback and stays correct at ANY bindHost
          # (mirrors the compose healthcheck; curl is installed in the image).
          # /health = liveness (process up); /readyz = readiness (503 until storage wired).
          livenessProbe:
            exec:
              command:
                - "curl"
                - "-fsS"
                - "http://127.0.0.1:{{ .Values.api.port }}/health"
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - "curl"
                - "-fsS"
                - "http://127.0.0.1:{{ .Values.api.port }}/readyz"
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "himmy-agent.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "himmy-agent.volumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
