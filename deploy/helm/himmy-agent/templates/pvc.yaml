{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "himmy-agent.pvcName" . }}
  labels:
    {{- include "himmy-agent.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.persistence.retain }}
    # Survive `helm uninstall` / a failed `helm upgrade --install`: this PVC holds
    # the ONLY copy of the shared /app/.himmy SQLite stores (api + worker), so Helm
    # must NOT garbage-collect it with the release. Set persistence.retain=false to
    # opt out (the PVC is then deleted on uninstall — all runs/traces are lost).
    "helm.sh/resource-policy": keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  {{- if (eq "-" .Values.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}
